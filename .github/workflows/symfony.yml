name: Symfony
on: push

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: ctype, iconv
        coverage: xdebug
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Check Symfony Container
      run: |
        php bin/console lint:container
    - name: Execute ECS
      run: |
        php vendor/bin/ecs --no-progress-bar
    - name: Execute Rector
      run: |
        php vendor/bin/rector --dry-run --no-progress-bar
    - name: Execute PHPStan
      run: |
        php vendor/bin/phpstan --no-progress --configuration=phpstan.dist.neon
    - name: Setup Database
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?serverVersion=16&charset=utf8
      run: |
        php bin/console doctrine:schema:create -n
        php bin/console doctrine:fixtures:load -n
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres?serverVersion=16&charset=utf8
      run: |
        php bin/phpunit
